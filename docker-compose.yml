version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ebookstore-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ebookstore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebookstore-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ebookstore?schema=public"
      NEXTAUTH_SECRET: "strong-32-char-random-secret-key-12345"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
